name: Feature request · Идея
description: Suggest an improvement · Предложить улучшение
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like · Что хотелось бы
      description: Describe the idea and why it is useful. · Опишите идею и зачем она нужна.
    validations:
      required: true
  - type: textarea
    id: alt
    attributes:
      label: Alternatives · Другие варианты
