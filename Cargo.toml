[package]
name = "hora"
version = "0.5.1"
edition = "2021"
build = "build.rs"
license = "MIT"
repository = "https://github.com/dark-knight-soul/hora"
description = "Hora — лёгкая смена обоев, большие часы и живые обои на рабочем столе Windows"

[[bin]]
name = "Hora"
path = "src/main.rs"

# 0.59 — с готовыми библиотеками импорта (более новые требуют ассемблер в системе)
[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_Networking_WinHttp",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_UI_Accessibility",
    "Win32_System_Power",
    "Win32_UI_Controls",
    "Win32_Globalization",
    "Win32_Security_Cryptography",
]

# Видеокарта (Direct3D 11, Direct2D, DirectComposition) и видео (Media Foundation) — для живых обоев.
# 0.58 — последняя версия на готовых библиотеках импорта (0.6x требуют ассемблер в системе).
[dependencies.windows]
version = "0.58"
features = [
    "implement",
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
]

# нужна макросу implement (свои COM-объекты, например уведомления видеопроигрывателя)
[dependencies.windows-core]
version = "0.58"

# Сборка «на минимум»: маленький exe, без лишнего кода паники
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
